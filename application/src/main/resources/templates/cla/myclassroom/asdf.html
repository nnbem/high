<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>나의 강의실</title>
    <link rel="stylesheet" th:href="@{/css/ClassStyle.css}" />
    <link rel="stylesheet" th:href="@{/css/CommonStyle.css}" />
</head>

<body>
    <div class="class_content">
        <section class="class_intro">
            <h2>나의강의실</h2>
        </section>

        <!-- 필터 및 검색 -->
        <div class="filter-bar">
            <button class="refresh-btn">⟳</button>
            <select class="sort-select" th:field="*{pageMaker.perPageNum}" onchange="search_list(1);">
                <option th:value="10">정렬개수</option>
                <option th:value="20">20개씩</option>
                <option th:value="50">50개씩</option>
            </select>
            <select class="category-select" th:field="*{searchType}">
                <option th:value="">전체</option>
                <option th:value="웹개발">웹개발</option>
                <option th:value="인공지능">인공지능</option>
                <option th:value="IoT">IoT</option>
                <option th:value="빅데이터">빅데이터</option>
                <option th:value="클라우드">클라우드</option>
            </select>
            <div class="search_box">
                <input type="text" name="keyword" placeholder="검색어를 입력해주세요." th:value="*{pageMaker.keyword}" />
                <button class="search_btn" onclick="search_list(1);">⌕</button>
            </div>
        </div>

        <!-- 강의 리스트 테이블 -->
        <table class="table_list">
            <thead class="thead">
                <tr>
                    <th>번호</th>
                    <th>분야</th>
                    <th>강의명</th>
                    <th>상태</th>
                    <th>등록일</th>
                </tr>
            </thead>
            <tbody>
                <!-- 수강 내역이 없을 경우 -->
                <th:block th:if="${historyList.empty}">
                    <tr>
                        <td colspan="5" class="text-center">
                            <strong>수강 신청한 강의가 없습니다.</strong>
                        </td>
                    </tr>
                </th:block>

                <!-- 수강 내역 반복 출력 -->
                <th:block th:each="course, varStatus : ${historyList}">
                    <tr th:object="${course}">
                        <td th:text="${varStatus.count}"></td>
                        <td th:text="*{category}"></td>
                        <td th:text="*{className}"></td>
                        <td th:text="*{complete == 1 ? '완료' : '진행중'}"></td>
                        <td th:text="*{#dates.format(regDate, 'yyyy-MM-dd')}"></td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </div>

    <script>
        function search_list(pageNum) {
            let searchType = document.querySelector(".category-select").value;
            let keyword = document.querySelector(".search_box input").value;
            let perPageNum = document.querySelector(".sort-select").value;
            
            window.location.href = `/class/myclassroom/list?pageNum=${pageNum}&perPageNum=${perPageNum}&searchType=${searchType}&keyword=${keyword}`;
        }
    </script>
</body>

</html>
