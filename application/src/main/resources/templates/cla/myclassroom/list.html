<link rel="stylesheet" th:href="@{/css/ClassStyle.css}" />
<link rel="stylesheet" th:href="@{/css/CommonStyle.css}" />

<div class="class_content">
    <section class="class_intro">
        <h2>나의강의실</h2>
    </section>

    <!-- 필터 및 검색 -->
    <div class="filter-bar">
        <button class="refresh-btn">⟳</button>
        <select class="sort-select">
            <option>정렬개수</option>
            <option>10개씩</option>
            <option>20개씩</option>
            <option>50개씩</option>
        </select>
        <select class="category-select">
            <option>전체</option>
            <option>웹개발</option>
            <option>인공지능</option>
            <option>IoT</option>
            <option>빅데이터</option>
            <option>클라우드</option>
        </select>
        <div class="search_box">
            <input type="text" placeholder="검색어를 입력해주세요.">
            <button class="search_btn">⌕</button>
        </div>
    </div>

    <!-- 강의 리스트 테이블 -->
    <table class="table_list">
        <thead class="thead">
            <tr>
                <th>번호</th>
                <th>분야</th>
                <th>강의명</th>
                <th>상태</th>
                <th>등록일</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>20</td>
                <td>웹개발</td>
                <td>2025 MySQL 강의</td>
                <td>취소</td>
                <td>2025-02-07</td>
            </tr>
        </tbody>
    </table>

</div>
